<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Forgot Password</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.ico" type="image/png"/>
    <meta name="robots" content="index,follow" />
    <meta name="generator" content="GrapesJS Studio" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Playfair+Display:wght@600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css?v=20261029-auth-theme-1" />
    <link rel="stylesheet" href="./css/shared-consistency.css?v=20260917-tables"/>
    <link rel="stylesheet" href="./css/dashboard-theme.css?v=20261029-theme-1"/>
    <link rel="stylesheet" href="./css/auth-theme.css?v=20261029-theme-1"/>
  </head>
  <body id="forgot-password-page" class="body auth-page">

    <header class="gjs-t-border header">
      <div class="header-container"></div>
    </header>

    <main class="forgot-main">
      <section class="forgot-card">
        <a href="./index.html" class="auth-brand" aria-label="FaceRoll login"><span class="auth-brand-mark"><img src="./Updated%20FaceRoll.png" alt="" class="auth-brand-logo" width="1536" height="1024"/></span><span class="auth-brand-text">FaceRoll</span></a>
        <form action="./index.html" method="post" class="forgot-form" id="forgotPasswordForm">
          <div>
            <h2>Reset your password</h2>
            <p class="forgot-description">
              Enter the email tied to your account and we will send a reset link.
            </p>
          </div>

          <div class="form-group">
            <label for="reset-email">Email</label>
            <input type="email" id="reset-email" name="email" autocomplete="email" required />
          </div>

          <button type="submit" class="forgot-button">Send reset link</button>

          <div class="reset-success" id="resetSuccess">
            Reset link sent. Return to login to continue.
          </div>

          <p class="back-link">
            <a href="./index.html">Back to Login</a>
          </p>
        </form>
      </section>
    </main>

    <footer class="gjs-t-border footer">
      <div class="footer-container">© FaceRoll</div>
    </footer>

    <script>
      (function () {
        const form = document.getElementById('forgotPasswordForm');
        const success = document.getElementById('resetSuccess');
        if (!form || !success) return;

        form.addEventListener('submit', function (event) {
          event.preventDefault();
          success.classList.add('is-visible');

          window.setTimeout(function () {
            window.location.href = './index.html';
          }, 1200);
        });
      })();
    </script>
  </body>
</html>
