<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Forgot Password</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="index,follow" />
    <meta name="generator" content="GrapesJS Studio" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Playfair+Display:wght@600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
    <style>
      body#forgot-password-page {
        margin: 0 !important;
        padding: 0 !important;
        min-height: 100vh;
        background:
          radial-gradient(circle at top left, rgba(191, 219, 254, 0.65), transparent 30%),
          linear-gradient(180deg, #f8fbff 0%, #eef4ff 100%);
        font-family: Inter, sans-serif;
        color: #0f172a;
      }

      body#forgot-password-page .header,
      body#forgot-password-page .footer {
        display: none !important;
      }

      body#forgot-password-page .forgot-brand {
        position: absolute;
        top: 16px;
        left: 16px;
        display: flex;
        align-items: center;
        gap: 8px;
        z-index: 10;
      }

      body#forgot-password-page .forgot-brand-logo {
        width: 86px;
        height: 86px;
        object-fit: contain;
        display: block !important;
        transform: scale(1.95);
        transform-origin: center center;
      }

      body#forgot-password-page .forgot-brand-text {
        font-size: 1.05rem;
        line-height: 1;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #0f172a;
        margin-left: -4px;
      }

      body#forgot-password-page .forgot-main {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        padding: 32px 20px;
      }

      body#forgot-password-page .forgot-card {
        width: 100%;
        max-width: 620px;
        margin: 0 auto;
        padding: 36px 32px 32px;
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid #dbe4f0;
        border-radius: 24px;
        box-shadow: 0 24px 60px rgba(15, 23, 42, 0.08);
        backdrop-filter: blur(10px);
      }

      body#forgot-password-page .forgot-form {
        width: 100%;
        max-width: 500px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      body#forgot-password-page h2 {
        margin: 0 0 10px 0;
        font-size: 2rem;
        line-height: 1.08;
        font-weight: 700;
        color: #0f172a;
        letter-spacing: -0.03em;
      }

      body#forgot-password-page .forgot-description {
        margin: 0 0 24px 0;
        color: #64748b;
        font-size: 0.95rem;
        max-width: 44ch;
      }

      body#forgot-password-page .form-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      body#forgot-password-page .form-group label {
        display: block;
        font-size: 0.95rem;
        font-weight: 600;
        color: #1e293b;
      }

      body#forgot-password-page .form-group input {
        width: 100%;
        border-radius: 12px !important;
        border: 1px solid #cbd5e1 !important;
        background: #ffffff !important;
        padding: 14px 16px !important;
        color: #0f172a !important;
        box-shadow: none !important;
        transition: border-color 150ms ease, box-shadow 150ms ease;
      }

      body#forgot-password-page .form-group input:focus {
        outline: none !important;
        border-color: #60a5fa !important;
        box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12) !important;
      }

      body#forgot-password-page .forgot-button {
        display: inline-flex !important;
        align-items: center !important;
        justify-content: center !important;
        width: 100%;
        border: 1px solid #1d4ed8 !important;
        border-radius: 12px !important;
        background: #1d4ed8 !important;
        color: #ffffff !important;
        padding: 14px 18px !important;
        font-weight: 700;
        font-size: 1rem;
        box-shadow: 0 16px 30px rgba(29, 78, 216, 0.22);
      }

      body#forgot-password-page .forgot-button:hover {
        background: #1e40af !important;
        border-color: #1e40af !important;
      }

      body#forgot-password-page .back-link {
        margin-top: 6px;
        text-align: center;
        color: #64748b;
      }

      body#forgot-password-page .back-link a {
        color: #1d4ed8;
        text-decoration: none;
        font-weight: 600;
      }

      body#forgot-password-page .back-link a:hover {
        color: #1e40af;
      }

      body#forgot-password-page .reset-success {
        display: none;
        margin-top: 6px;
        padding: 12px 14px;
        border: 1px solid #86efac;
        border-radius: 12px;
        background: #dcfce7;
        color: #166534;
        font-size: 0.95rem;
      }

      body#forgot-password-page .reset-success.is-visible {
        display: block;
      }

      @media (max-width: 600px) {
        body#forgot-password-page .forgot-main {
          padding: 20px 14px;
        }

        body#forgot-password-page .forgot-card {
          padding: 24px 18px;
          border-radius: 18px;
        }

        body#forgot-password-page h2 {
          font-size: 1.75rem;
        }

        body#forgot-password-page .forgot-brand {
          top: 12px;
          left: 12px;
        }

        body#forgot-password-page .forgot-brand-logo {
          width: 64px;
          height: 64px;
          transform: scale(1.6);
        }
      }
    </style>
  </head>
  <body id="forgot-password-page" class="body">
    <div class="forgot-brand">
      <img
        src="./Transparent FaceRoll.png"
        alt="FaceRoll logo"
        class="forgot-brand-logo"
      />
      <div class="forgot-brand-text">FaceRoll</div>
    </div>

    <header class="gjs-t-border header">
      <div class="header-container"></div>
    </header>

    <main class="forgot-main">
      <section class="forgot-card">
        <form action="./index.html" method="post" class="forgot-form" id="forgotPasswordForm">
          <div>
            <h2>Reset your password</h2>
            <p class="forgot-description">
              Enter the email tied to your account and we will send a reset link.
            </p>
          </div>

          <div class="form-group">
            <label for="reset-email">Email</label>
            <input type="email" id="reset-email" name="email" required />
          </div>

          <button type="submit" class="forgot-button">Send reset link</button>

          <div class="reset-success" id="resetSuccess">
            Reset link sent. Return to login to continue.
          </div>

          <p class="back-link">
            <a href="./index.html">Back to Login</a>
          </p>
        </form>
      </section>
    </main>

    <footer class="gjs-t-border footer">
      <div class="footer-container">© FaceRoll</div>
    </footer>

    <script>
      (function () {
        const form = document.getElementById('forgotPasswordForm');
        const success = document.getElementById('resetSuccess');
        if (!form || !success) return;

        form.addEventListener('submit', function (event) {
          event.preventDefault();
          success.classList.add('is-visible');

          window.setTimeout(function () {
            window.location.href = './index.html';
          }, 1200);
        });
      })();
    </script>
  </body>
</html>
