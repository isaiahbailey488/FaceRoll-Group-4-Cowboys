  <body id="iel609" class="body">
    <header class="gjs-t-border header">
      <div class="header-container"></div>
    </header>

    <main class="login-main">
      <div class="login-layout">
        <section class="login-card">
          <div class="login-page-brand">
            <div class="login-page-brand-mark">
              <img
                src="./Transparent FaceRoll.png"
                alt=""
                class="login-page-brand-logo"
                width="1536"
                height="1024"
              />
            </div>
            <h1 class="login-page-brand-text">FaceRoll</h1>
          </div>
          <p class="login-description">
            Sign in to your attendance dashboard.
          </p>

          <form
            method="post"
            action="./instructor-dashboard.html"
            class="login-form"
            id="loginForm"
          >
            <div class="form-group">
              <label for="email-2">Email</label>
              <input type="email" id="email-2" name="email" required />
            </div>

            <div class="form-group">
              <label for="password-2">Password</label>
              <input
                type="password"
                id="password-2"
                name="password"
                required
              />
            </div>

            <div class="forgot-password">
              <a href="./forgot-password.html">Forgot password?</a>
            </div>

            <p id="loginMessage" class="auth-message" aria-live="polite"></p>

            <button type="submit" class="login-button">Login</button>

            <p class="register-link">
              Don't have an account?
              <a href="./register.html">Register</a>
            </p>
          </form>
        </section>

          <a href="./forgot-password.html">Need help?</a>
        </div>
