<!DOCTYPE html>
<html lang="en">
  <head>
    <title>FaceRoll Login</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.ico" type="image/png"/>
    <meta name="robots" content="index,follow" />
    <meta name="generator" content="GrapesJS Studio" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Playfair+Display:wght@600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css?v=20261029-auth-theme-1" />
    <link rel="stylesheet" href="./css/shared-consistency.css?v=20260917-tables"/>
    <link rel="stylesheet" href="./css/dashboard-theme.css?v=20261029-theme-1"/>
    <link rel="stylesheet" href="./css/auth-theme.css?v=20261029-larger-brand-4"/>
  </head>
  <body id="iel609" class="body auth-page">
    <header class="gjs-t-border header">
      <div class="header-container"></div>
    </header>

    <main class="login-main">
      <div class="login-layout">
        <section class="login-card">
          <a href="./index.html" class="auth-brand" aria-label="FaceRoll login"><span class="auth-brand-mark"><img src="./Updated%20FaceRoll.png" alt="" class="auth-brand-logo" width="1536" height="1024"/></span><span class="auth-brand-text">FaceRoll</span></a>
          <p class="login-description">
            Sign in to your attendance dashboard.
          </p>

          <form
            method="post"
            action="./instructor-dashboard.html"
            class="login-form"
            id="loginForm"
          >
            <div class="form-group">
              <label for="email-2">Email</label>
              <input type="email" id="email-2" name="email" autocomplete="username" required />
            </div>

            <div class="form-group">
              <label for="password-2">Password</label>
              <input
                type="password"
                id="password-2"
                name="password"
                autocomplete="current-password"
                required
              />
            </div>

            <div class="forgot-password">
              <a href="./forgot-password.html">Forgot password?</a>
            </div>

            <p id="loginMessage" class="auth-message" aria-live="polite"></p>

            <button type="submit" class="login-button">Login</button>

            <p class="register-link">
              Don't have an account?
              <a href="./register.html">Register</a>
            </p>
          </form>
        </section>

        <div class="login-help">
          <a href="./forgot-password.html">Need help?</a>
        </div>
      </div>
    </main>

    <footer class="gjs-t-border footer">
      <div class="footer-container">© FaceRoll</div>
    </footer>
    <script defer src="/__/firebase/11.6.0/firebase-app-compat.js"></script>
    <script defer src="/__/firebase/11.6.0/firebase-auth-compat.js"></script>
    <script defer src="/__/firebase/11.6.0/firebase-firestore-compat.js"></script>
    <script defer src="/__/firebase/init.js?useEmulator=true"></script>
    <script defer src="./js/firebase-client.js?v=20261005-auth-cycle-1"></script>
    <script defer src="./js/auth-pages.js?v=20261005-terms-review-2"></script>
  </body>
</html>
